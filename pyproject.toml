[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vera-vision"
version = "0.2.0"
description = "Bounded, provider-neutral vision observations for Vera applications"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vera-vision = "vera_vision.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
